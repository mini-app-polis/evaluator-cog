# evaluator-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: pipeline-cog

traits:
  - pipeline-cog-evaluator
  # This repo IS evaluator-cog — PIPE-011 (AI evaluation step) cannot
  # apply to the evaluator itself.

# Note: evaluator-cog serves nothing and polls nothing. It is an AWS Lambda
# behind an SQS queue: api-kaianolevine-com puts a message on the queue when
# a repository releases, and fans out one message per repository plus one for
# the fleet-scoped checks when the standards catalog or the evaluator itself
# releases. The event source mapping invokes the function. pipeline_eval.py
# remains a library module called in-process by other cogs.
#
# That is what pipeline-cog means now (ecosystem-standards ADR-009), so the
# Prefect-era exemptions this file used to carry are gone with the rules
# they exempted from.

deferrals:
  # Infrastructure moved out of this repository into mini-app-polis/infra
  # (one Terraform root, one shared cog-worker module). These rules still
  # read a local infra/*.tf that no longer exists; they are to be retargeted
  # at the infra repository and the module. Nothing they check was removed:
  # the queue, dead-letter queue, redrive policy, ReportBatchItemFailures,
  # concurrency ceiling (now a module validation), limits and the DLQ alarm
  # with an action are all declared there.
  - rule: PIPE-016
    reason: "Queue, function and event source mapping are declared in mini-app-polis/infra (cogs.tf, modules/cog-worker), not a local infra/."
    until: null
  - rule: PIPE-017
    reason: "Redrive policy, DLQ and ReportBatchItemFailures are fixed by modules/cog-worker in mini-app-polis/infra for every cog."
    until: null
  - rule: PIPE-018
    reason: "The concurrency ceiling is set in mini-app-polis/infra cogs.tf, and modules/cog-worker refuses a plan that states it zero or two times."
    until: null
  - rule: CD-010
    reason: "The dead-letter-queue alarm and its SNS action are declared by modules/cog-worker in mini-app-polis/infra."
    until: null
  - rule: CD-024
    reason: "Function memory and timeout are set in mini-app-polis/infra cogs.tf."
    until: null

exemptions:
  - rule: PIPE-015
    reason: >
      The canonical pattern PIPE-015 describes starts from a Drive event
      picked up by watcher-cog. There is no input artifact here to watch:
      the event that should evaluate a repository is that repository
      cutting a release, and CI posts it to
      api-kaianolevine-com, which enqueues it. That is event-driven — more
      so than the daily cron this exemption used to describe — but it is
      not the shape PIPE-015 checks for.
  - rule: PIPE-008
    reason: "The deterministic checker source contains retired trigger pattern strings (e.g. repository_dispatch) as string literals being checked against, not as active trigger usage. PIPE-008 does not apply."
  - rule: CD-009
    reason: "evaluator_config.py uses stdlib logging intentionally — it is a pure utility module loaded during unit tests where the mini_app_polis shared logger is unavailable. CD-009 does not apply to test-safe utility modules."
  - rule: CD-010
    reason: >
      sentry_sdk.init() is present with SENTRY_DSN in the entry
      point, src/evaluator_cog/adapters/lambda_worker.py, called at import
      rather than per invocation so a warm container initialises once. The
      LLM conformance pass cannot read source content directly and
      incorrectly flags this as absent.

# TEST-001/002/004 covered by pipeline-cog type scoping (evaluator has no
# normalization/deduplication of external data — its output is evaluation findings).
