# evaluator-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-0001, ADR-0002

type: pipeline-cog

traits:
  - pipeline-cog-evaluator
  # This repo IS evaluator-cog — PIPE-011 (AI evaluation step) cannot
  # apply to the evaluator itself.

# Note: evaluator-cog serves nothing and polls nothing. It is an AWS Lambda
# behind an SQS queue: api-kaianolevine-com puts a message on the queue when
# a repository releases, and fans out one message per repository plus one for
# the fleet-scoped checks when the standards catalog or the evaluator itself
# releases. The event source mapping invokes the function.
#
# That is what pipeline-cog means now (ecosystem-standards ADR-0009), so the
# Prefect-era exemptions this file used to carry are gone with the rules
# they exempted from.

exemptions:
  - rule: PIPE-015
    reason: >
      The canonical pattern PIPE-015 describes starts from a Drive event
      picked up by watcher-cog. There is no input artifact here to watch:
      the event that should evaluate a repository is that repository
      cutting a release, and CI posts it to
      api-kaianolevine-com, which enqueues it. That is event-driven — more
      so than the daily cron this exemption used to describe — but it is
      not the shape PIPE-015 checks for.
  - rule: PIPE-008
    reason: "The deterministic checker source contains retired trigger pattern strings (e.g. repository_dispatch) as string literals being checked against, not as active trigger usage. PIPE-008 does not apply."

# TEST-001/002/004 covered by pipeline-cog type scoping (evaluator has no
# normalization/deduplication of external data — its output is evaluation findings).
