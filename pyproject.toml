[project]
name = "evaluator-cog"
dynamic = ["version"]
description = "Standalone pipeline evaluation flow for the Kaiano ecosystem."
requires-python = ">=3.11"
dependencies = [
    # 5.10.0 is the floor, not a preference: RunReport.run_id lands there,
    # and below it conformance.py sets an attribute nothing reads — every run
    # report goes out as "local-run", silently.
    "miniapppolis-common-utils>=5.13.1,<6",
    "boto3>=1.34,<2",
    "httpx>=0.27",
    # Direct: models.py defines the finding schema with it. It used to
    # arrive transitively through fastapi, which was never a dependency
    # this package's own code justified — dropping the web server is what
    # made that visible rather than what broke it.
    "pydantic>=2.6,<3.0",
    "sentry-sdk>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "ruff>=0.8.0",
    "respx>=0.21.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/evaluator_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_cog"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","ARG","SIM"]
ignore = ["E501","B008","ARG001"]

[tool.ruff.lint.per-file-ignores]
# CHECK_ID = "..." is a documentation convention in every check function —
# it names the rule the function implements even when the literal is inlined
# elsewhere in the body. Keep it, silence F841.
"src/evaluator_cog/engine/deterministic/*.py" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["evaluator_cog"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 0
show_missing = true
