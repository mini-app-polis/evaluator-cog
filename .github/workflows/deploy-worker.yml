# Deploys the worker's code to Lambda. Nothing else.
#
# The split is deliberate: Terraform owns the function's configuration —
# role, environment, timeout, concurrency — and is applied from a
# workstation; this owns the code. The deploy role can call
# UpdateFunctionCode and GetFunction and nothing more, so a compromised
# workflow cannot repoint the worker at a different API without someone
# reviewing a .tf file.
#
# Runs on release, and by hand when needed.
#
# The manual-only period is over: the mapping is enabled, the Railway
# consumer is gone, and the function is what actually evaluates. Leaving
# deploys manual now would mean a release that changes handler() ships the
# change everywhere except the thing running it — the deployed code
# drifting behind main, silently, which is the shape this fleet keeps
# paying for.
#
# workflow_dispatch stays for redeploying a known-good build without
# cutting a release.

name: Deploy worker

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write # for OIDC; this is what replaces a long-lived key
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the function zip
        run: |
          set -euo pipefail

          # --target, not a venv: Lambda unpacks the zip onto sys.path and
          # imports from its top level, so the package's own layout is the
          # one the runtime sees. handler in infra/worker.tf names
          # evaluator_cog.adapters.lambda_worker, which only resolves if
          # evaluator_cog/ is at the root of this archive.
          uv pip install --target build/ . --quiet

          # Not optional, and not a size micro-optimisation. Measured:
          # 41.5 MB zipped against a 50 MB limit with boto3 in the package,
          # 25.8 MB without. The runtime ships boto3 already, so bundling
          # it buys nothing and spends most of the remaining headroom on a
          # copy that is then shadowed anyway.
          rm -rf build/boto3 build/botocore build/s3transfer build/jmespath

          # The Google client stack, which this cog does not use at all —
          # no mini_app_polis.google, no GoogleAPI, no googleapiclient. It
          # arrives because miniapppolis-common-utils depends on it
          # unconditionally for the cogs that do, and the library's lazy
          # __init__ means nothing here ever imports it.
          #
          # Measured: 150 MB unzipped and 28.4 MB zipped with it, 42 MB and
          # 15.3 MB without. That is the cold start, on every invocation
          # that gets one.
          #
          # Stripped here rather than fixed in common-utils on purpose.
          # Making it a [google] extra is a breaking change for every other
          # consumer — watcher, transcription, wiki-curator and deejay all
          # get it free today and would fail at import without declaring
          # it. That belongs at the end of the per-cog migrations, when
          # every consumer already declares what it needs. This is local
          # and reversible.
          rm -rf build/googleapiclient build/google build/gspread \
                 build/google_auth_httplib2.py build/httplib2 \
                 build/oauth2client build/pyasn1 build/pyasn1_modules \
                 build/rsa build/uritemplate

          rm -rf build/*.dist-info build/__pycache__

          # Fail here rather than at the first invocation. An import error
          # from a zip whose layout is wrong surfaces as a Lambda runtime
          # error on a real message — which, with the mapping enabled,
          # means the message retries three times and lands in the DLQ
          # before anyone knows the deploy was bad.
          test -f build/evaluator_cog/adapters/lambda_worker.py || {
            echo "::error::lambda_worker is not at the package root of the zip"
            exit 1
          }

          # Import every module against the package as it will be unpacked,
          # with boto3 supplied the way the runtime supplies it and nothing
          # else on the path. This is what makes the strip above safe: it
          # is only correct while nothing imports what it removed, and that
          # is a property of the code rather than of this file. Adding a
          # Google call upstream should fail this build, not a message.
          python -m venv /tmp/rt && /tmp/rt/bin/pip install --quiet boto3
          RT=$(/tmp/rt/bin/python -c "import site; print(site.getsitepackages()[0])")
          PYTHONPATH="$PWD/build:$RT" python - <<'IMPORTS'
          import importlib, pkgutil, sys
          import evaluator_cog

          failed = []
          for m in pkgutil.walk_packages(evaluator_cog.__path__, "evaluator_cog."):
              try:
                  importlib.import_module(m.name)
              except Exception as exc:
                  failed.append(f"{m.name}: {type(exc).__name__}: {exc}")
          if failed:
              print("::error::the package does not import as it will be unpacked")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print("every module imports from the built package")
          IMPORTS

          cd build
          zip -qr "$GITHUB_WORKSPACE/worker.zip" .
          cd "$GITHUB_WORKSPACE"

          size=$(stat -c%s worker.zip)
          echo "zip is $((size / 1024 / 1024)) MB of the 50 MB direct-upload limit"
          if [ "$size" -gt 47000000 ]; then
            echo "::error::the zip is within 3 MB of the 50 MB limit"
            exit 1
          fi

          echo "LOCAL_SHA=$(openssl dgst -sha256 -binary worker.zip | base64)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.AWS_FUNCTION_NAME }}" \
            --zip-file fileb://worker.zip \
            --publish >/dev/null
          aws lambda wait function-updated \
            --function-name "${{ vars.AWS_FUNCTION_NAME }}"

      # "Which version is actually deployed" answered by the pipeline
      # rather than by inspection later. The checksum AWS reports must be
      # the checksum of the artifact this run built.
      - name: Confirm what is deployed
        run: |
          REMOTE_SHA=$(aws lambda get-function \
            --function-name "${{ vars.AWS_FUNCTION_NAME }}" \
            --query 'Configuration.CodeSha256' --output text)
          echo "built:    $LOCAL_SHA"
          echo "deployed: $REMOTE_SHA"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::the deployed checksum is not the one this run built"
            exit 1
          fi
