name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over
  # full history, pip-audit against the resolved dependency set, semgrep,
  # and a CycloneDX SBOM retained as a build artifact. The steps live in
  # mini-app-polis/.github so the pinned tool versions and the gating
  # decisions are in one place; see that repo's README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v3
    with:
      language: python
      package-manager: uv

  # Lock check, lint, format and tests, from the shared workflow so every
  # cog's `test` stage is the same stage. See mini-app-polis/.github.
  test:
    uses: mini-app-polis/.github/.github/workflows/python-test.yml@v3
    with:
      # TEST-012. Without this input the shared workflow skips its
      # typecheck step and says nothing, which is how this repo went
      # untyped.
      typecheck: "uv run mypy src/"

  release:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # VER-006: semantic-release and its plugins from the fleet's shared lockfile.
    uses: mini-app-polis/.github/.github/workflows/release.yml@v3

  # The worker is deployed here, as a job, rather than by a workflow's own
  # trigger: a release published with GITHUB_TOKEN starts no workflows.
  deploy:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      id-token: write
      contents: read
    uses: mini-app-polis/.github/.github/workflows/lambda-deploy.yml@v3
    with:
      ref: ${{ needs.release.outputs.tag }}
      # These three match the function declared in mini-app-polis/infra; the deploy refuses a function
      # whose architecture differs.
      handler: evaluator_cog.adapters.lambda_worker.lambda_handler
      architecture: arm64
      python-version: "3.11"
      # The Google client stack, which evaluator-cog never imports but
      # common-utils depends on unconditionally. The deploy imports every
      # module in Lambda's image, so a strip that removes something used
      # fails the build rather than a message.
      strip: >-
        googleapiclient google gspread google_auth_httplib2.py httplib2
        oauth2client pyasn1 pyasn1_modules rsa uritemplate
      role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      region: ${{ vars.AWS_REGION }}
      function-name: ${{ vars.AWS_FUNCTION_NAME }}

  # A fleet sweep, not a single repository. A new evaluator can reach a
  # different verdict on every repo in the fleet, so all of them are stale
  # at once — and the checks that scope to no repository have nowhere
  # else to run.
  #
  # The sweep must run on the evaluator this release built, which is the
  # entire reason for the trigger — so it waits on the deploy job, which
  # does not finish until AWS reports the new code's checksum. A fixed
  # sleep was the Railway-era answer and outlived Railway: with no deploy
  # actually running, it only delayed a sweep of the old code.
  evaluate:
    needs: deploy
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    with:
      scope: fleet
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
