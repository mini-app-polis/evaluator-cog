name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over
  # full history, pip-audit against the resolved dependency set, semgrep,
  # and a CycloneDX SBOM retained as a build artifact. The steps live in
  # mini-app-polis/.github so the pinned tool versions and the gating
  # decisions are in one place; see that repo's README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v2
    with:
      language: python
      package-manager: uv

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.11
      # CD-020. `uv sync` without --locked silently re-resolves when the
      # lockfile and pyproject.toml disagree, so a stale lock passes CI and
      # then fails the deploy, where `uv sync --locked` refuses the drift.
      # Checked here because this is where the failure is cheap to fix.
      - name: Verify the lockfile matches pyproject
        run: uv lock --check

      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --cov=src --cov-report=term-missing
  release:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      # semantic-release tags the release commit it leaves at HEAD. No tag
      # there means the push carried nothing releasable, and nothing new
      # needs deploying.
      - name: Record the release tag
        id: released
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n1)" >> "$GITHUB_OUTPUT"

  # The worker is deployed here rather than by deploy-worker.yml's own
  # trigger: a release published with GITHUB_TOKEN starts no workflows.
  deploy:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-worker.yml
    with:
      ref: ${{ needs.release.outputs.tag }}

  # A fleet sweep, not a single repository. A new evaluator can reach a
  # different verdict on every repo in the fleet, so all of them are stale
  # at once — and the three checks that scope to no repository (EVAL-003,
  # MONO-003, EVAL-007) have nowhere else to run.
  #
  # The sweep must run on the evaluator this release built, which is the
  # entire reason for the trigger — so it waits on the deploy job, which
  # does not finish until AWS reports the new code's checksum. A fixed
  # sleep was the Railway-era answer and outlived Railway: with no deploy
  # actually running, it only delayed a sweep of the old code.
  evaluate:
    needs: deploy
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    with:
      scope: fleet
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
