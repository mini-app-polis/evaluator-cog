# Merges a pull request into dev once every check on it has passed. The
# logic, and what it will not merge, is in the shared workflow; see its
# header in mini-app-polis/.github.
name: automerge

on:
  workflow_run:
    # Every workflow here that runs on pull_request.
    workflows: [CI]
    types: [completed]
    # Only runs on other branches can be a pull request into dev (in
    # practice Dependabot's). Pushes to main and dev, and the promotion pull
    # request, whose head is dev, would only start a run that skips (CD-035).
    branches-ignore: [main, dev]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  automerge:
    uses: mini-app-polis/.github/.github/workflows/automerge.yml@v3
    # Merges as the promote GitHub App, whose credentials are org secrets.
    secrets: inherit
