repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
  # SEC-001. Same gitleaks the shared security workflow runs in CI, so a
  # secret is caught before it is committed rather than after it is pushed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  # ADR-0016. The same command CI runs as `facts check`: regenerates
  # facts.json before every commit and, when it changed, adds it to the
  # commit being made (--stage).
  - repo: local
    hooks:
      - id: facts
        name: facts generate
        entry: uvx --from 'miniapppolis-common-utils>=8.7.0' facts generate --stage
        language: system
        pass_filenames: false
        always_run: true
